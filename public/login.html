<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gesty Management — Acceso</title>
<link rel="stylesheet" href="/styles.css">
<style>
  .login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 10%,var(--primary-soft),transparent 45%),var(--bg)}
  .login{width:min(400px,100%)}
  .login .brand{justify-content:center;padding-bottom:10px}
  .login h2{font-size:22px;text-align:center}
  .login .sub{text-align:center;margin-bottom:20px}
  .login .field{margin-bottom:14px}
  .login .btn{width:100%;justify-content:center;padding:11px}
  .err{color:var(--red);font-size:13px;min-height:18px;margin:6px 0 10px}
</style>
</head>
<body>
<div class="login-wrap">
  <form class="card login" id="form">
    <div class="brand"><div class="brand-mark"><svg class="i" aria-hidden="true"><use href="/icons.svg#sprout"/></svg></div><div class="brand-text">Gesty<small>Management</small></div></div>
    <h2>Iniciar sesión</h2>
    <p class="sub">Accede a tu panel de gestión.</p>
    <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required></div>
    <div class="field"><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
    <div class="err" id="err" role="alert"></div>
    <button class="btn primary" type="submit"><svg class="i" aria-hidden="true"><use href="/icons.svg#log-in"/></svg>Entrar</button>
  </form>
</div>
<div class="toast" id="toast"></div>
<script src="/common.js"></script>
<script>
initTheme();
$('#form').onsubmit = async e => {
  e.preventDefault();
  $('#err').textContent = '';
  const btn = $('button[type=submit]');
  btn.disabled = true;
  try {
    const r = await api('/api/login', { method: 'POST', body: { email: $('#email').value, password: $('#password').value } });
    location.href = r.redirect;
  } catch (err) { $('#err').textContent = err.message; }
  finally { btn.disabled = false; }
};
</script>
</body>
</html>
